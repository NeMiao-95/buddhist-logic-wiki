# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 仏教論理学・認識論研究Wiki
  pageTitleSuffix: " | Buddhist Epistemology & Logic"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: ja-JP
  baseUrl: NeMiao-95.github.io/buddhist-logic-wiki
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif
      body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif
      code: ui-monospace, SFMono-Regular, Menlo, monospace
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: "rgba(143, 159, 169, 0.15)"
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: "rgba(143, 159, 169, 0.15)"
        textHighlight: "#b3aa0288"
plugins:
  transformers:
    - source: "@quartz-community/frontmatter"
    - source: "@quartz-community/created-modified-date"
      options:
        priority:
          - "frontmatter"
          - "git"
          - "filesystem"
    - source: "@quartz-community/syntax-highlighting"
      options:
        theme:
          light: "github-light"
          dark: "github-dark"
        keepBackground: false
    - source: "@quartz-community/obsidian-flavour"
      options:
        enableInHtmlEmbed: false
    - source: "@quartz-community/ox-hugo"
    - source: "@quartz-community/table-of-contents"
    - source: "@quartz-community/crawl-links"
      options:
        markdownLinkResolution: "shortest"
    - source: "@quartz-community/description"
    - source: "@quartz-community/latex"
      options:
        renderEngine: "katex"
  filters:
    - source: "@quartz-community/remove-drafts"
  emitters:
    - source: "@quartz-community/alias-redirects"
    - source: "@quartz-community/component-resources"
    - source: "@quartz-community/content-page"
    - source: "@quartz-community/folder-page"
    - source: "@quartz-community/tag-page"
    - source: "@quartz-community/content-index"
      options:
        enableSiteMap: true
        enableRSS: true
    - source: "@quartz-community/favicon"
    - source: "@quartz-community/not-found-page"
